name: Build OpenZL CLI Binaries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone OpenZL repository
        run: git clone --depth 1 https://github.com/facebook/openzl.git openzl

      - name: Build OpenZL CLI
        run: |
          cd openzl
          make zli

      - name: Copy binary
        run: |
          mkdir -p "@openzl-cli/build/binaries/${{ matrix.platform }}"
          zli_path=$(find openzl -type f -name zli -perm -111 | head -1)
          if [ -z "$zli_path" ]; then
            echo "zli binary not found after build" >&2
            exit 1
          fi
          cp "$zli_path" "@openzl-cli/build/binaries/${{ matrix.platform }}/zli"
          chmod +x "@openzl-cli/build/binaries/${{ matrix.platform }}/zli"

      - name: Test binary
        run: |
          "@openzl-cli/build/binaries/${{ matrix.platform }}/zli" --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zli-${{ matrix.platform }}
          path: "@openzl-cli/build/binaries/${{ matrix.platform }}/"
          retention-days: 30

  package-and-publish:
    needs: build-binaries
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Extract binaries to package
        run: |
          mkdir -p @openzl-cli/build/binaries
          for dir in binaries/zli-*/; do
            platform=$(basename "$dir")
            platform=${platform#zli-}
            mkdir -p "@openzl-cli/build/binaries/$platform"
            cp -r "$dir"/* "@openzl-cli/build/binaries/$platform/"
            chmod +x "@openzl-cli/build/binaries/$platform/zli" || true
          done
          ls -laR @openzl-cli/build/binaries

      - name: Test package
        run: |
          cd @openzl-cli
          npm pack
          npm install -g amirja811-openzl-cli-*.tgz
          zli --version

      - name: Publish to npm
        if: github.event_name == 'release'
        run: |
          cd @openzl-cli
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
