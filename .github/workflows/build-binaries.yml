name: Build OpenZL CLI Binaries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

# Superseded runs only add to the runner queue; drop them.
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
            optional: true
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          # OpenZL does not build under MSVC yet (C2099 in encoder_registry.c).
          - os: windows-latest
            platform: win32-x64
            optional: true

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: ${{ matrix.optional == true }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone OpenZL repository
        run: git clone --depth 1 https://github.com/facebook/openzl.git openzl

      - name: Build OpenZL CLI (Unix)
        if: runner.os != 'Windows'
        run: |
          cd openzl
          make zli

      - name: Build OpenZL CLI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd openzl
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DOPENZL_BUILD_TESTS=OFF \
            -DOPENZL_BUILD_BENCHMARKS=OFF \
            -DOPENZL_BUILD_EXAMPLES=OFF \
            -DOPENZL_BUILD_PYTHON_EXT=OFF
          cmake --build build --config Release --target zli -j

      - name: Copy binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "@openzl-cli/build/binaries/${{ matrix.platform }}"
          zli_path=$(find openzl -type f -name zli -perm -111 | head -1)
          if [ -z "$zli_path" ]; then
            echo "zli binary not found after build" >&2
            exit 1
          fi
          cp "$zli_path" "@openzl-cli/build/binaries/${{ matrix.platform }}/zli"
          chmod +x "@openzl-cli/build/binaries/${{ matrix.platform }}/zli"

      - name: Copy binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "@openzl-cli/build/binaries/${{ matrix.platform }}"
          zli_path=$(find openzl -type f \( -name zli.exe -o -name zli \) | head -1)
          if [ -z "$zli_path" ]; then
            echo "zli.exe not found after build" >&2
            find openzl -name '*zli*' | head -40
            exit 1
          fi
          cp "$zli_path" "@openzl-cli/build/binaries/${{ matrix.platform }}/zli.exe"

      - name: Test binary
        shell: bash
        run: |
          if [ -f "@openzl-cli/build/binaries/${{ matrix.platform }}/zli.exe" ]; then
            "@openzl-cli/build/binaries/${{ matrix.platform }}/zli.exe" --version
          else
            "@openzl-cli/build/binaries/${{ matrix.platform }}/zli" --version
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zli-${{ matrix.platform }}
          path: "@openzl-cli/build/binaries/${{ matrix.platform }}/"
          retention-days: 30

  package-and-publish:
    # Ship the platforms that built; one failing leg must not block the rest.
    if: always()
    needs: build-binaries
    # Packing and publishing needs no macOS; those runners queue for hours here.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The NPM_TOKEN secret was created as an *environment* secret in a GitHub
    # environment named "NPM_TOKEN". A job only sees an environment's secrets
    # if it opts into that environment here; without this line
    # secrets.NPM_TOKEN is empty and the fallback publish would fail.
    environment: NPM_TOKEN

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: |
          npm install -g npm@^11
          npm --version

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Extract binaries to package
        run: |
          set -euo pipefail
          mkdir -p @openzl-cli/build/binaries
          shopt -s nullglob
          if [ -z "$(ls -A binaries 2>/dev/null)" ]; then
            echo "No zli binaries were produced by any platform." >&2
            exit 1
          fi
          for dir in binaries/zli-*/; do
            platform=$(basename "$dir")
            platform=${platform#zli-}
            mkdir -p "@openzl-cli/build/binaries/$platform"
            cp -r "$dir"/* "@openzl-cli/build/binaries/$platform/"
            chmod +x "@openzl-cli/build/binaries/$platform/zli" 2>/dev/null || true
            chmod +x "@openzl-cli/build/binaries/$platform/zli.exe" 2>/dev/null || true
          done
          ls -laR @openzl-cli/build/binaries

      - name: Test package
        run: |
          cd @openzl-cli
          npm pack
          npm install -g amirja811-openzl-cli-*.tgz
          zli --version

      - name: Publish to npm (trusted publishing)
        id: publish_oidc
        if: github.event_name == 'release'
        continue-on-error: true
        working-directory: '@openzl-cli'
        run: npm publish --access public --provenance

      - name: Publish to npm (granular token fallback)
        if: github.event_name == 'release' && steps.publish_oidc.outcome == 'failure'
        working-directory: '@openzl-cli'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already on registry; OIDC publish succeeded late. Nothing to do."
            exit 0
          fi

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Trusted publishing failed and no NPM_TOKEN secret is set." >&2
            exit 1
          fi

          echo "::warning::Trusted publishing failed; falling back to NPM_TOKEN."
          npm publish --access public --provenance

      - name: Verify published version is live
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          name=$(node -p "require('./@openzl-cli/package.json').name")
          version=$(node -p "require('./@openzl-cli/package.json').version")

          for attempt in 1 2 3 4 5; do
            if npm view "$name@$version" version; then
              echo "$name@$version is live."
              exit 0
            fi
            echo "Not visible yet (attempt $attempt); retrying..."
            sleep 15
          done

          echo "$name@$version never appeared on the registry." >&2
          exit 1
