name: Build OpenZL CLI Binaries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone OpenZL repository
        run: git clone --depth 1 https://github.com/facebook/openzl.git openzl

      - name: Build OpenZL CLI
        run: |
          cd openzl
          make zli

      - name: Copy binary
        run: |
          mkdir -p "@openzl-cli/build/binaries/${{ matrix.platform }}"
          zli_path=$(find openzl -type f -name zli -perm -111 | head -1)
          if [ -z "$zli_path" ]; then
            echo "zli binary not found after build" >&2
            exit 1
          fi
          cp "$zli_path" "@openzl-cli/build/binaries/${{ matrix.platform }}/zli"
          chmod +x "@openzl-cli/build/binaries/${{ matrix.platform }}/zli"

      - name: Test binary
        run: |
          "@openzl-cli/build/binaries/${{ matrix.platform }}/zli" --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zli-${{ matrix.platform }}
          path: "@openzl-cli/build/binaries/${{ matrix.platform }}/"
          retention-days: 30

  package-and-publish:
    needs: build-binaries
    runs-on: macos-latest

    # The NPM_TOKEN secret was created as an *environment* secret in a GitHub
    # environment named "NPM_TOKEN". A job only sees an environment's secrets
    # if it opts into that environment here; without this line
    # secrets.NPM_TOKEN is empty and the fallback publish would fail.
    environment: NPM_TOKEN

    permissions:
      contents: read
      # Required to mint the OIDC token npm exchanges for a short-lived
      # publish credential (trusted publishing) and to sign provenance.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.x; trusted publishing needs npm >= 11.5.1.
      - name: Upgrade npm
        run: |
          npm install -g npm@^11
          npm --version

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Extract binaries to package
        run: |
          mkdir -p @openzl-cli/build/binaries
          for dir in binaries/zli-*/; do
            platform=$(basename "$dir")
            platform=${platform#zli-}
            mkdir -p "@openzl-cli/build/binaries/$platform"
            cp -r "$dir"/* "@openzl-cli/build/binaries/$platform/"
            chmod +x "@openzl-cli/build/binaries/$platform/zli" || true
          done
          ls -laR @openzl-cli/build/binaries

      - name: Test package
        run: |
          cd @openzl-cli
          npm pack
          npm install -g amirja811-openzl-cli-*.tgz
          zli --version

      # Primary path: trusted publishing. No secret is used here on purpose --
      # if NODE_AUTH_TOKEN is present npm prefers it and skips OIDC entirely.
      - name: Publish to npm (trusted publishing)
        id: publish_oidc
        if: github.event_name == 'release'
        continue-on-error: true
        working-directory: '@openzl-cli'
        run: npm publish --access public --provenance

      # Fallback path: granular access token, scoped to this package only.
      # Runs only if OIDC publishing failed (trusted publisher not yet
      # configured, npm OIDC outage, etc).
      - name: Publish to npm (granular token fallback)
        if: github.event_name == 'release' && steps.publish_oidc.outcome == 'failure'
        working-directory: '@openzl-cli'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          # The OIDC step may have failed *after* the registry accepted the
          # upload. Re-publishing would then hard-fail on EPUBLISHCONFLICT,
          # so treat an already-present version as success.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already on registry; OIDC publish succeeded late. Nothing to do."
            exit 0
          fi

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Trusted publishing failed and no NPM_TOKEN secret is set." >&2
            echo "Configure the trusted publisher on npmjs.com, or add a granular token." >&2
            exit 1
          fi

          echo "::warning::Trusted publishing failed; falling back to NPM_TOKEN."
          npm publish --access public --provenance

      - name: Verify published version is live
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          name=$(node -p "require('./@openzl-cli/package.json').name")
          version=$(node -p "require('./@openzl-cli/package.json').version")

          # Registry reads can lag a fresh publish; retry before declaring failure.
          for attempt in 1 2 3 4 5; do
            if npm view "$name@$version" version; then
              echo "$name@$version is live."
              exit 0
            fi
            echo "Not visible yet (attempt $attempt); retrying..."
            sleep 15
          done

          echo "$name@$version never appeared on the registry." >&2
          exit 1
