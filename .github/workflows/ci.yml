name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Superseded runs only add to the runner queue; drop them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux carries the required coverage: it is the only platform whose
        # runners are reliably available here, and it runs in ~20s.
        os: [ubuntu-latest]
        node: [18, 20, 22, 24]
        include:
          # macOS runners on this account have queued ~16h and then been killed
          # by GitHub's 6-hour job ceiling, so keep one best-effort darwin leg
          # rather than three that can never report.
          - os: macos-latest
            node: 22
            optional: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci || npm install
      - name: Build TypeScript
        run: npm run build
      - name: Unit / adapter / trust tests
        run: |
          node scripts/test-middleware.mjs
          node scripts/test-fastify.mjs
          node scripts/test-stream.mjs
          node scripts/test-prebuild.mjs
          node scripts/test-dual.mjs
          node scripts/test-trust.mjs
      - name: Release check
        run: node scripts/release-check.mjs
      - name: Pack + install smoke
        run: node scripts/pack-smoke.mjs

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Gzip path smoke (OpenZL optional on Windows without binary)
        shell: bash
        run: |
          node -e "
          import('openzl-express').then(async (m) => {
            const enc = m.pickEncoding('gzip');
            if (enc !== 'gzip') throw new Error(enc);
            const gz = await m.compressGzip(Buffer.from('x'.repeat(2000)));
            if (!gz.length) throw new Error('empty gzip');
            console.log('windows smoke ok', gz.length);
          });
          "
