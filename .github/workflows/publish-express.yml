name: Publish openzl-express

on:
  release:
    types: [ published ]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: NPM_TOKEN
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # The published tarball carries no prebuilds; postinstall fetches them
      # from this release. Give the native build a head start so early
      # installers are not left without one. Non-fatal: a missing prebuild only
      # means the runtime falls back to the zli CLI / gzip.
      - name: Wait for native prebuild assets
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 20); do
            names=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -c 'openzl_native-' || true)
            if [ "${names:-0}" -gt 0 ]; then
              echo "$names prebuild asset(s) attached."
              exit 0
            fi
            echo "No prebuild assets yet (attempt $attempt/20); waiting 30s..."
            sleep 30
          done
          echo "::warning::Publishing without prebuild assets attached; installs will fall back to CLI/gzip until they appear."
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@^11
      - run: npm ci || npm install
      # Optional: fuller openzl coverage when CLI package is already published
      - name: Try optional OpenZL CLI (non-fatal)
        continue-on-error: true
        run: npm install @amirja811/openzl-cli@^0.3.0 --no-save || true
      - run: npm run build
      # Tests soft-skip openzl when native/CLI missing; gzip/zstd heroes must pass
      - run: npm test
      - run: node scripts/release-check.mjs
      - run: node scripts/pack-smoke.mjs
      - name: Publish (trusted)
        id: oidc
        continue-on-error: true
        run: npm publish --access public --provenance
      - name: Publish (token fallback)
        if: steps.oidc.outcome == 'failure'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already published"
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "no NPM_TOKEN" >&2
            exit 1
          fi
          npm publish --access public --provenance
