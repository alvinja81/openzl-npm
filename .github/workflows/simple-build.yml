name: Build OpenZL CLI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone OpenZL repository
        run: |
          git clone https://github.com/facebook/openzl.git openzl

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install build dependencies (macOS)
        run: |
          brew install cmake

      - name: Build OpenZL CLI
        run: |
          cd openzl
          ls -la
          make --version
          # Build zli directly (dependencies are already built)
          make zli
          
      - name: Create binary directory
        run: |
          mkdir -p @openzl-cli/build/binaries/${{ matrix.platform }}

      - name: Copy binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp openzl/cachedObjs/*/zli @openzl-cli/build/binaries/${{ matrix.platform }}/zli
          chmod +x @openzl-cli/build/binaries/${{ matrix.platform }}/zli

      - name: Copy binary (Windows)
        if: runner.os == 'Windows'
        run: |
          copy openzl\cachedObjs\*\zli.exe @openzl-cli\build\binaries\${{ matrix.platform }}\zli.exe

      - name: Test binary
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            @openzl-cli\build\binaries\${{ matrix.platform }}\zli.exe --version
          else
            @openzl-cli/build/binaries/${{ matrix.platform }}/zli --version
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zli-${{ matrix.platform }}
          path: "@openzl-cli/build/binaries/${{ matrix.platform }}/"
